name = "pos-hero-inbox"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "INBOX"
class_name = "Inbox"

# Durable Object แบบ SQLite ใช้ได้ในแผนฟรีของ Cloudflare
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Inbox"]

# กระเป๋าสินค้า (Catalog Hero) — Durable Object แยกจาก Inbox
[[durable_objects.bindings]]
name = "CATALOG"
class_name = "Catalog"

# เก็บรูปสินค้า ต้องเปิด R2 ในบัญชี Cloudflare และสร้าง bucket ก่อน deploy (ดู docs/cloudflare-setup.md)
[[r2_buckets]]
binding = "CATALOG_IMAGES"
bucket_name = "pos-hero-catalog"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Catalog"]
